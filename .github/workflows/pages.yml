name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'schedule' || vars.RESEARCHMAP_API_APPROVED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync disclosed researchmap publications
        if: vars.RESEARCHMAP_API_APPROVED == 'true'
        run: node scripts/sync-researchmap.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
