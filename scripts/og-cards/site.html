<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #ffffff; }
  body {
    box-sizing: border-box;
    padding: 84px 96px 72px;
    display: flex; flex-direction: column;
    color: #1c1f26;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    border-top: 14px solid #2f4f7f;
  }
  .name { font-family: "Hiragino Mincho ProN", serif; font-weight: 600; font-size: 92px; letter-spacing: .16em; line-height: 1.1; margin: 0; font-feature-settings: "palt"; }

  .rule { margin: 46px 0 34px; border-top: 2px solid #b7c7e0; }
  .fields { font-family: "Hiragino Mincho ProN", serif; font-size: 34px; letter-spacing: .08em; line-height: 1.5; }
  .fields-en { margin-top: 8px; font-size: 22px; letter-spacing: .02em; color: #3c424d; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; font-size: 24px; color: #6b7280; letter-spacing: .04em; }

</head>
<body>
  <p class="name">佐藤亮司</p>
  <div class="en">RYOJI SATO</div>
  <div class="rule"></div>
  <div class="fields">心の哲学・認知科学の哲学・応用倫理学</div>
  <div class="fields-en">Philosophy of Mind · Philosophy of Cognitive Science · Applied Ethics</div>
  <div class="foot"><span>東京都立大学 大学教育センター</span><b>ryojisato.org</b></div>
