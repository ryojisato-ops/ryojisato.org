<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #ffffff; }
  body {
    display: grid; grid-template-columns: 150px 1fr;
    color: #1c1f26;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  .spine {
    background: #2f4f7f; color: #ffffff;
    writing-mode: vertical-rl; text-orientation: mixed;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    font-family: "Hiragino Mincho ProN", serif; font-size: 30px; letter-spacing: .14em; white-space: nowrap;
    font-feature-settings: "palt";
  }
  .body { padding: 76px 84px 64px; display: flex; flex-direction: column; }
  .label { font-size: 26px; font-weight: 600; letter-spacing: .14em; color: #2f4f7f; }
  .title { margin: 26px 0 0; font-family: "Hiragino Mincho ProN", serif; font-weight: 600; font-size: 76px; line-height: 1.25; letter-spacing: .06em; font-feature-settings: "palt"; }
  .sub { margin-top: 22px; font-family: "Hiragino Mincho ProN", serif; font-size: 32px; letter-spacing: .04em; color: #3c424d; }
  .rule { margin: 40px 0 0; border-top: 2px solid #b7c7e0; }
  .data { margin-top: 26px; font-size: 26px; letter-spacing: .06em; color: #3c424d; }
  .foot { margin-top: auto; font-size: 24px; color: #2f4f7f; font-weight: 600; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="spine">自由エネルギー原理を哲学する</div>
  <div class="body">
    <div class="label">Web付録　変分自由エネルギー／期待自由エネルギー</div>
    <p class="title">自由エネルギー原理を<br>哲学する</p>
    <div class="sub">身体・意識・AIをつなぐ「大統一理論」の射程</div>
    <div class="rule"></div>
    <div class="data">佐藤亮司 著　勁草書房　2026年11月刊</div>
    <div class="foot">ryojisato.org/books/free-energy-principle/</div>
  </div>
</body>
</html>
